under_test:
  - model_id: qwen3.6-35b-a3b@v1
    backend: openai_compat
    api_model: "qwen3.6-35b-a3b"
    base_url_env: OLLAMA_HUB_BASE_URL
    params:
      temperature: 0.0
      seed: 42
      max_tokens: 2048
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  - model_id: gemma4-26b-a4b-it@v1
    backend: openai_compat
    api_model: "gemma4-26b-a4b-it"
    base_url_env: OLLAMA_HUB_BASE_URL
    params:
      temperature: 0.0
      seed: 42
      max_tokens: 2048
  - model_id: gemma4-e4b-it@v1
    backend: openai_compat
    api_model: "gemma4-e4b-it"
    base_url_env: OLLAMA_HUB_BASE_URL
    params:
      temperature: 0.0
      seed: 42
      max_tokens: 2048
  - model_id: qwen3.5-9b@v1
    backend: openai_compat
    api_model: "qwen3.5-9b"
    base_url_env: OLLAMA_HUB_BASE_URL
    params:
      temperature: 0.0
      seed: 42
      max_tokens: 2048
