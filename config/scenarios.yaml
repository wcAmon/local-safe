        output: |
          Suggested public-safe summary:
          A user described a workplace-related experience and a commute-related concern.
          Keep identifiers generalized and avoid location/company/style markers.
    write_public_report:
      - args: {}
        output: "{report_id: rpt_002, status: stored}"

